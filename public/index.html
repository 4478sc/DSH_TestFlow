<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f172a">
  <title>TestFlow · 测试数据记录台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2338bdf8'/%3E%3Ctext x='16' y='21' font-size='12' text-anchor='middle' fill='%2306121f' font-family='monospace'%3ETF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8"/><path d="M10 12h4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L18 10l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 16-5-5L5 20"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5M12 17h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="m8 8 12 10M8 16 20 6"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="m6 7 1 13h10l1-13"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>TF</span><i></i></div>
        <div class="brand-copy">
          <h1>TestFlow</h1>
          <p>测试项目 · 数据记录台</p>
        </div>
      </div>

      <div class="project-bar">
        <span class="project-label">项目</span>
        <select class="project-select" id="projectSelect" aria-label="切换测试项目"></select>
        <button type="button" class="icon-btn" id="newProjectBtn" title="上传同类表格新建项目" aria-label="新建项目">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
        </button>
        <button type="button" class="icon-btn" id="deleteProjectBtn" title="删除当前项目" aria-label="删除当前项目">
          <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg>
        </button>
      </div>

      <div class="topbar-stats" id="topStats" aria-label="测试项目统计"></div>

      <div class="topbar-actions">
        <button type="button" class="btn btn-quiet" id="exportXlsxBtn" title="导出当前项目的测试记录为 XLSX">
          <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg>
          <span>导出 XLSX</span>
        </button>
        <button type="button" class="btn btn-quiet" id="exportZipBtn" title="备份全部项目：数据库快照与附件">
          <svg class="icon" aria-hidden="true"><use href="#i-archive"></use></svg>
          <span>备份 ZIP</span>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="模块导航与统计">
        <section class="sidebar-section">
          <div class="section-label"><span>模块</span><span class="section-label-num" id="moduleTotal"></span></div>
          <nav class="module-list" id="moduleList" aria-label="按模块筛选"></nav>
        </section>

        <section class="sidebar-section">
          <div class="section-label"><span>优先级分布</span></div>
          <div class="priority-stats" id="priorityStats"></div>
        </section>

        <section class="sidebar-section">
          <div class="section-label">
            <span>记录统计</span>
            <button type="button" class="text-btn" id="retryIndexBtn" hidden>重试</button>
          </div>
          <div id="recordStats" class="record-stats"></div>
        </section>

        <details class="sidebar-section instructions" id="instructionsBox">
          <summary>
            <span>填写说明</span>
            <span class="summary-tail"><span class="summary-count" id="instructionCount"></span><svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"></use></svg></span>
          </summary>
          <div class="instruction-list" id="instructionList"></div>
        </details>

        <div class="sidebar-foot" id="sourceLine"></div>
      </aside>

      <section class="list-pane" aria-label="测试项列表">
        <div class="list-header">
          <div class="list-title-row">
            <h2>测试项</h2>
            <span class="count-pill" id="testCount">—</span>
            <button type="button" class="btn btn-quiet btn-sm list-add" id="newTestBtn" title="在当前项目中新建测试项">
              <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
              <span>新建测试项</span>
            </button>
          </div>

          <div class="search-box">
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            <input id="searchInput" type="search" placeholder="搜索编号、标题、目的、指标…" autocomplete="off" spellcheck="false" aria-label="搜索测试项">
            <kbd>/</kbd>
          </div>

          <div class="filter-row">
            <label class="select-wrap">
              <span>优先级</span>
              <select id="priorityFilter" aria-label="按优先级筛选">
                <option value="all">全部</option>
              </select>
            </label>
            <button type="button" class="text-btn" id="clearFiltersBtn" hidden>清除筛选</button>
          </div>
          <div class="active-filters" id="activeFilters"></div>

          <div class="clipboard-bar" id="clipboardBar" hidden>
            <span class="clipboard-mark" aria-hidden="true">
              <svg class="icon"><use href="#i-paste"></use></svg>
            </span>
            <span class="clipboard-text" id="clipboardText"></span>
            <span class="clipboard-actions">
              <button type="button" class="btn btn-sm btn-primary" id="pasteClipboardBtn">粘贴</button>
              <button type="button" class="btn btn-sm" id="clearClipboardBtn">取消</button>
            </span>
          </div>
        </div>

        <div class="test-list" id="testList" aria-label="测试项目列表"></div>
      </section>

      <section class="detail-pane" id="detailPane" aria-label="测试详情" aria-live="polite"></section>
    </div>
  </div>

  <div class="toast-area" id="toastArea" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-backdrop" data-lightbox-close></div>
    <figure class="lightbox-figure" role="dialog" aria-modal="true" aria-label="附件预览">
      <div class="lightbox-bar">
        <figcaption id="lightboxCaption">附件预览</figcaption>
        <button type="button" class="icon-btn" id="lightboxClose" aria-label="关闭预览">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <div class="lightbox-stage"><img id="lightboxImage" alt=""></div>
    </figure>
  </div>

  <noscript>
    <div class="noscript">此应用需要启用 JavaScript 才能读取测试项与记录。</div>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
